<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0B1B2D" />
<meta name="robots" content="noindex, nofollow" />
<title>J3 Prep Gym</title>
<meta name="description" content="Shared workout log for Jayden, Jackson, Jameson and Dad — synced across every device." />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230B1B2D'/%3E%3Ctext x='32' y='44' font-family='Georgia,serif' font-size='30' fill='%23C8A95C' text-anchor='middle'%3EJ3%3C/text%3E%3C/svg%3E" />
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230B1B2D'/%3E%3Ctext x='32' y='44' font-family='Georgia,serif' font-size='30' fill='%23C8A95C' text-anchor='middle'%3EJ3%3C/text%3E%3C/svg%3E" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="J3 Gym" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#0B1B2D; --navy-mid:#122843; --navy-card:#14293F; --navy-in:#0E2135;
  --cream:#F7F2E6; --cream-soft:rgba(247,242,230,.78); --cream-mute:rgba(247,242,230,.5);
  --gold:#C8A95C; --gold-bright:#E0BD68;
  --line:rgba(247,242,230,.12); --line-soft:rgba(247,242,230,.07);
  --ok:#5FC9C0; --warn:#E8825A;
  --serif:'Fraunces',Georgia,'Times New Roman',serif;
  --sans:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
  --r:16px;
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{
  background:var(--navy); color:var(--cream); font-family:var(--sans);
  font-size:16px; line-height:1.5; min-height:100vh;
  background-image:radial-gradient(1100px 520px at 50% -180px,rgba(200,169,92,.16),transparent 70%);
  background-repeat:no-repeat;
}
button,input,select{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer}
input,select{background:none;border:0;outline:0}
:focus-visible{outline:2px solid var(--gold-bright);outline-offset:2px;border-radius:6px}
.wrap{max-width:1120px;margin:0 auto;padding:0 16px 96px}

header{padding:26px 0 14px;display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
.brand{display:flex;flex-direction:column;gap:3px;min-width:0}
.eyebrow{font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--gold);font-weight:600}
.wordmark{font-family:var(--serif);font-size:clamp(30px,6vw,44px);font-weight:600;line-height:1;letter-spacing:-.01em}
.wordmark em{font-style:italic;color:var(--gold-bright)}
.tagline{font-size:13px;color:var(--cream-mute);margin-top:4px}

.syncpill{display:inline-flex;align-items:center;gap:8px;padding:8px 14px;border:1px solid var(--line);
  border-radius:999px;background:rgba(247,242,230,.04);font-size:12.5px;color:var(--cream-soft);white-space:nowrap}
.syncpill:hover{border-color:rgba(247,242,230,.24)}
.syncpill .dot{width:8px;height:8px;border-radius:50%;background:var(--cream-mute);flex:none}
.syncpill.on .dot{background:var(--ok);box-shadow:0 0 0 4px rgba(95,201,192,.18)}
.syncpill.off .dot{background:var(--warn);box-shadow:0 0 0 4px rgba(232,130,90,.16)}
.syncpill.busy .dot{background:var(--gold-bright);animation:pulse 1.1s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}

nav.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:8px 0 24px;overflow-x:auto;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{padding:12px 16px;font-size:14px;font-weight:500;color:var(--cream-mute);
  border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;transition:color .15s}
nav.tabs button:hover{color:var(--cream-soft)}
nav.tabs button[aria-selected="true"]{color:var(--cream);border-bottom-color:var(--gold)}

.datebar{display:flex;align-items:center;gap:10px;margin-bottom:18px;flex-wrap:wrap}
.datenav{display:flex;align-items:center;gap:2px;border:1px solid var(--line);border-radius:999px;
  background:rgba(247,242,230,.04);padding:3px}
.datenav button{width:38px;height:38px;border-radius:50%;color:var(--cream-soft);font-size:18px;
  display:grid;place-items:center;transition:background .15s}
.datenav button:hover{background:rgba(247,242,230,.08);color:var(--cream)}
.datenav .label{font-family:var(--serif);font-size:17px;font-weight:600;padding:0 12px;min-width:190px;text-align:center}
.datenav .label small{display:block;font-family:var(--sans);font-size:11px;font-weight:500;
  letter-spacing:.14em;text-transform:uppercase;color:var(--gold);margin-top:1px}
.btn{border:1px solid var(--line);border-radius:999px;padding:9px 16px;font-size:13.5px;font-weight:500;
  color:var(--cream-soft);background:rgba(247,242,230,.04);transition:all .15s}
.btn:hover{background:rgba(247,242,230,.09);color:var(--cream);border-color:rgba(247,242,230,.22)}
.btn.gold{background:var(--gold);color:#12202E;border-color:var(--gold);font-weight:600}
.btn.gold:hover{background:var(--gold-bright);border-color:var(--gold-bright);color:#12202E}
.btn.danger:hover{color:var(--warn);border-color:rgba(232,130,90,.4)}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.spacer{flex:1 1 auto}

.card{background:linear-gradient(180deg,rgba(247,242,230,.045),rgba(247,242,230,.02));
  border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.tablescroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
table.log{width:100%;border-collapse:collapse;min-width:520px}
table.log th,table.log td{padding:0;text-align:center;vertical-align:middle}
table.log thead th{padding:14px 8px 12px;border-bottom:1px solid var(--line);font-weight:600;font-size:13px;
  position:relative;background:var(--navy-mid)}
table.log thead th.exh{text-align:left;padding-left:18px;position:sticky;left:0;z-index:3;background:var(--navy-mid);
  font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--cream-mute);font-weight:600}
.athname{font-family:var(--serif);font-size:16px;font-weight:600;color:var(--ath);letter-spacing:-.01em;display:block}
.athbar{position:absolute;left:12%;right:12%;top:0;height:3px;background:var(--ath);border-radius:0 0 3px 3px;opacity:.9}
.athtot{display:block;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--cream-mute);
  font-weight:500;margin-top:2px;font-variant-numeric:tabular-nums}
table.log tbody tr{border-bottom:1px solid var(--line-soft)}
table.log tbody tr:last-child{border-bottom:0}
table.log tbody tr:hover{background:rgba(247,242,230,.025)}
td.exname{text-align:left;padding:12px 14px 12px 18px;position:sticky;left:0;z-index:2;
  background:var(--navy);min-width:150px;max-width:230px;border-right:1px solid var(--line-soft)}
table.log tbody tr:hover td.exname{background:#0D1F32}
.exname b{display:block;font-weight:600;font-size:14.5px;line-height:1.25;overflow-wrap:anywhere}
.exname small{display:block;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--gold);
  margin-top:3px;font-weight:600}
td.cell{padding:6px 5px}
.cellin{width:100%;min-width:56px;height:50px;text-align:center;border-radius:11px;
  border:1px solid transparent;background:rgba(247,242,230,.035);font-size:19px;font-weight:600;
  font-variant-numeric:tabular-nums;color:var(--cream-mute);transition:all .15s;font-family:var(--sans)}
.cellin::placeholder{color:rgba(247,242,230,.18);font-weight:400;font-size:17px}
.cellin:hover{background:rgba(247,242,230,.07)}
.cellin:focus{border-color:var(--ath);background:rgba(247,242,230,.09);color:var(--cream);
  box-shadow:0 0 0 3px color-mix(in srgb,var(--ath) 22%,transparent)}
.cellin.filled{color:var(--ath);background:color-mix(in srgb,var(--ath) 13%,transparent);
  border-color:color-mix(in srgb,var(--ath) 30%,transparent)}
.cellin::-webkit-outer-spin-button,.cellin::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.cellin[type=number]{-moz-appearance:textfield}
.rowdel{opacity:0;width:28px;height:28px;border-radius:50%;color:var(--cream-mute);font-size:15px;
  display:grid;place-items:center;transition:all .15s;flex:none}
tr:hover .rowdel,.rowdel:focus-visible{opacity:1}
.rowdel:hover{background:rgba(232,130,90,.16);color:var(--warn)}
.exhead{display:flex;align-items:center;gap:8px}
.exhead>div{min-width:0;flex:1}

.addrow{border-top:1px solid var(--line);background:rgba(247,242,230,.025);padding:14px 16px}
.addform{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.field{border:1px solid var(--line);border-radius:10px;background:var(--navy-in);padding:10px 13px;font-size:14px;
  color:var(--cream);transition:border-color .15s}
.field::placeholder{color:rgba(247,242,230,.3)}
.field:focus{border-color:var(--gold)}
.field.grow{flex:1 1 190px;min-width:0}
select.field{cursor:pointer;flex:0 0 auto}
select.field option{background:var(--navy-mid);color:var(--cream)}

.empty{padding:56px 24px;text-align:center;color:var(--cream-mute)}
.empty h3{font-family:var(--serif);font-size:21px;color:var(--cream-soft);font-weight:600;margin-bottom:8px}
.empty p{font-size:14px;max-width:44ch;margin:0 auto;line-height:1.6}

.exercisecard{margin-bottom:20px;padding:20px}
.exercisecard h3{font-family:var(--serif);font-size:22px;font-weight:600;letter-spacing:-.01em}
.exercisecard .unit{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:600;margin-top:2px}
.cardhead{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;margin-bottom:16px;flex-wrap:wrap}
.chartbox{position:relative;width:100%;margin:4px 0 18px}
.chartbox svg{width:100%;height:auto;display:block;overflow:visible}
.statgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(132px,1fr));gap:10px}
.stat{border:1px solid var(--line);border-left:3px solid var(--ath);border-radius:11px;padding:11px 13px;
  background:rgba(247,242,230,.03)}
.stat .who{font-size:11px;letter-spacing:.13em;text-transform:uppercase;color:var(--ath);font-weight:600}
.stat .now{font-family:var(--serif);font-size:26px;font-weight:600;line-height:1.15;margin-top:3px;
  font-variant-numeric:tabular-nums}
.stat .sub{font-size:11.5px;color:var(--cream-mute);margin-top:3px;font-variant-numeric:tabular-nums}
.chg{font-weight:600;font-variant-numeric:tabular-nums}
.chg.up{color:var(--ok)} .chg.down{color:var(--warn)} .chg.flat{color:var(--cream-mute)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--cream-soft)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:14px;height:3px;border-radius:2px;background:var(--ath);display:inline-block}

.section{padding:20px;margin-bottom:18px}
.section h3{font-family:var(--serif);font-size:19px;font-weight:600;margin-bottom:5px}
.section p.help{font-size:13.5px;color:var(--cream-mute);line-height:1.6;margin-bottom:16px;max-width:66ch}
.section p.help code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12.5px;
  background:rgba(247,242,230,.08);padding:2px 6px;border-radius:5px;color:var(--gold-bright);overflow-wrap:anywhere}
.section p.help a{color:var(--gold-bright)}
.rowline{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line-soft);flex-wrap:wrap}
.rowline:last-child{border-bottom:0}
.swatch{width:12px;height:12px;border-radius:4px;background:var(--ath);flex:none}
.note{font-size:12.5px;margin-top:10px;min-height:18px}
.note.ok{color:var(--ok)} .note.bad{color:var(--warn)} .note.dim{color:var(--cream-mute)}
.toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,80px);background:var(--navy-card);
  border:1px solid var(--line);border-radius:999px;padding:11px 22px;font-size:13.5px;z-index:50;
  box-shadow:0 12px 34px rgba(0,0,0,.5);opacity:0;transition:all .28s cubic-bezier(.2,.8,.3,1);pointer-events:none;max-width:90vw}
.toast.show{transform:translate(-50%,0);opacity:1}
footer{text-align:center;font-size:12px;color:rgba(247,242,230,.32);padding:30px 0 8px}
footer a{color:rgba(247,242,230,.5)}
@media (max-width:640px){
  .wrap{padding:0 11px 90px}
  .datenav .label{min-width:145px;font-size:15.5px}
  td.exname{min-width:118px;padding-left:12px}
  table.log thead th.exh{padding-left:12px}
  .cellin{height:46px;font-size:17px;min-width:52px}
  .exercisecard,.section{padding:16px}
  .rowdel{opacity:1}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">
      <span class="eyebrow">J3 Prep · Athletics</span>
      <h1 class="wordmark">The <em>Gym</em> Log</h1>
      <span class="tagline">Jayden · Jackson · Jameson · Dad</span>
    </div>
    <button class="syncpill" id="syncpill" title="Sync status — tap to sync now"><span class="dot"></span><span id="synctext">Starting…</span></button>
  </header>

  <nav class="tabs" role="tablist">
    <button role="tab" data-view="log" aria-selected="true">Today's Workout</button>
    <button role="tab" data-view="progress" aria-selected="false">Progress</button>
    <button role="tab" data-view="setup" aria-selected="false">Setup</button>
  </nav>

  <main id="view"></main>

  <footer>J3 Prep · Cape Coral, Florida — <a href="/">j3prep.com</a></footer>
</div>
<div class="toast" id="toast"></div>

<script>
'use strict';

/* ============================================================
   J3 Prep Gym — offline-first store synced through a private
   GitHub repo (dalecci/j3prep-gym-data). Every device keeps a
   full localStorage mirror; rows merge last-write-wins.
   ============================================================ */

const GH = { owner:'dalecci', repo:'j3prep-gym-data', path:'data.json' };
const LSKEY = 'j3gym_store_v1';
const TOKKEY = 'j3gym_sync_token';
const TABLES = ['athletes','exercises','entries','settings'];

const SEED_ATHLETES = [
  { id:'ath-jayden',  name:'Jayden',  color:'#E0BD68', pos:1 },
  { id:'ath-jackson', name:'Jackson', color:'#5FC9C0', pos:2 },
  { id:'ath-jameson', name:'Jameson', color:'#E8825A', pos:3 },
  { id:'ath-dad',     name:'Dad',     color:'#9B8CD6', pos:4 }
];
const SEED_EXERCISES = [
  { id:'ex-pushups', name:'Push-ups', unit:'reps', dir:'up',   pos:1 },
  { id:'ex-situps',  name:'Sit-ups',  unit:'reps', dir:'up',   pos:2 },
  { id:'ex-squats',  name:'Squats',   unit:'reps', dir:'up',   pos:3 },
  { id:'ex-plank',   name:'Plank',    unit:'sec',  dir:'up',   pos:4 },
  { id:'ex-mile',    name:'Mile Run', unit:'min',  dir:'down', pos:5 }
];
const UNITS = ['reps','sec','min','lbs','miles','laps','rounds','inches','points'];
const PALETTE = ['#E0BD68','#5FC9C0','#E8825A','#9B8CD6','#7FB069','#D98CB3','#6FA8DC','#D4A373'];

/* ---------- store ---------- */

const Store = (() => {
  let state = { lastSync:0, data:{} };
  let online = false, syncing = false, lastError = '';
  const listeners = new Set();

  function deviceId(){
    let id = localStorage.getItem('j3gym_device');
    if (!id){ id = 'dev-' + Math.random().toString(36).slice(2,10); localStorage.setItem('j3gym_device', id); }
    return id;
  }
  function uid(){ return 'id-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2,8); }

  function load(){
    try { const raw = localStorage.getItem(LSKEY); if (raw) state = JSON.parse(raw); } catch(e){}
    if (!state.data) state.data = {};
    for (const t of TABLES) if (!Array.isArray(state.data[t])) state.data[t] = [];
  }
  function save(){
    try { localStorage.setItem(LSKEY, JSON.stringify(state)); }
    catch(e){ console.error('local save failed', e); }
  }

  function rows(t){ return state.data[t].filter(r => !r.deleted); }
  function get(t, id){ return state.data[t].find(r => r.id === id) || null; }

  function upsert(t, row, quiet){
    if (!row.id) row.id = uid();
    const next = { ...row, updated_at: row.updated_at != null ? row.updated_at : Date.now(), device_id: deviceId() };
    const i = state.data[t].findIndex(r => r.id === next.id);
    if (i >= 0) state.data[t][i] = { ...state.data[t][i], ...next };
    else state.data[t].push(next);
    save();
    if (!quiet){ notify(); scheduleSync(); }
    return next.id;
  }
  function remove(t, id){
    const r = get(t, id);
    if (r) upsert(t, { ...r, deleted:1, updated_at: Date.now() });
  }

  /* seeds carry updated_at:1 so any real edit anywhere in the world wins */
  function seed(){
    let added = 0;
    for (const a of SEED_ATHLETES)
      if (!state.data.athletes.some(r => r.id === a.id)){ upsert('athletes', { ...a, updated_at:1 }, true); added++; }
    if (!get('settings','seed_exercises_v1')){
      for (const e of SEED_EXERCISES)
        if (!state.data.exercises.some(r => r.id === e.id)){ upsert('exercises', { ...e, updated_at:1 }, true); added++; }
      upsert('settings', { id:'seed_exercises_v1', value:'1', updated_at:1 }, true);
    }
    if (added) save();
  }

  /* ---------- github cloud backend ---------- */

  function token(){ return localStorage.getItem(TOKKEY) || ''; }
  function setToken(t){
    if (t && t.trim()) localStorage.setItem(TOKKEY, t.trim());
    else localStorage.removeItem(TOKKEY);
    return sync();
  }

  function b64encode(str){
    const bytes = new TextEncoder().encode(str);
    let bin = '';
    for (let i = 0; i < bytes.length; i += 8192) bin += String.fromCharCode.apply(null, bytes.subarray(i, i+8192));
    return btoa(bin);
  }
  function b64decode(b64){
    const bin = atob(String(b64).replace(/\s/g,''));
    const bytes = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    return new TextDecoder().decode(bytes);
  }

  /* cloud -> this device */
  function mergeIncoming(tables){
    let changed = false;
    for (const t of TABLES){
      for (const row of (tables && tables[t]) || []){
        if (!row || !row.id) continue;
        const local = state.data[t].find(r => r.id === row.id);
        if (local && Number(local.updated_at||0) >= Number(row.updated_at||0)) continue;
        if (local) Object.assign(local, row);
        else state.data[t].push(row);
        changed = true;
      }
    }
    if (changed) save();
    return changed;
  }
  /* this device -> cloud; returns number of rows pushed */
  function mergeOutgoing(doc){
    let changed = 0;
    for (const t of TABLES){
      if (!Array.isArray(doc.tables[t])) doc.tables[t] = [];
      const byId = new Map(doc.tables[t].map(r => [r.id, r]));
      for (const row of state.data[t]){
        const remote = byId.get(row.id);
        if (!remote || Number(remote.updated_at||0) < Number(row.updated_at||0)){
          if (remote) Object.assign(remote, row); else doc.tables[t].push(row);
          changed++;
        }
      }
    }
    return changed;
  }

  async function githubSync(){
    const url = 'https://api.github.com/repos/' + GH.owner + '/' + GH.repo + '/contents/' + GH.path;
    const headers = {
      Authorization: 'Bearer ' + token(),
      Accept: 'application/vnd.github+json',
      'X-GitHub-Api-Version': '2022-11-28'
    };
    for (let attempt = 0; attempt < 3; attempt++){
      let doc = { format:1, tables:{} }, sha = null;
      const res = await fetch(url + '?nocache=' + Date.now(), { headers, cache:'no-store' });
      if (res.status === 200){
        const body = await res.json();
        sha = body.sha;
        try { doc = JSON.parse(b64decode(body.content)); } catch(e){ doc = { format:1, tables:{} }; }
        if (!doc.tables) doc.tables = {};
      } else if (res.status === 401 || res.status === 403){
        throw new Error('token');
      } else if (res.status === 404){
        throw new Error('norepo');
      } else {
        throw new Error('HTTP ' + res.status);
      }

      const gotNew = mergeIncoming(doc.tables);
      const pushed = mergeOutgoing(doc);
      if (pushed === 0) return gotNew;

      const put = await fetch(url, {
        method:'PUT', headers,
        body: JSON.stringify({
          message: 'gym log — ' + deviceId(),
          content: b64encode(JSON.stringify(doc)),
          ...(sha ? { sha } : {})
        })
      });
      if (put.ok) return gotNew;
      if (put.status === 409 || put.status === 422) continue;  // another device won — refetch
      if (put.status === 401 || put.status === 403) throw new Error('token');
      throw new Error('HTTP ' + put.status);
    }
    throw new Error('busy');
  }

  let timer = null;
  function scheduleSync(){ clearTimeout(timer); timer = setTimeout(sync, 900); }

  async function sync(){
    if (syncing) return;
    if (!token()){ lastError = 'notoken'; setOnline(false); notify('sync'); return; }
    syncing = true; notify('sync');
    let changed = false;
    try {
      changed = await githubSync();
      state.lastSync = Date.now(); save();
      lastError = ''; setOnline(true);
    } catch(e){
      lastError = e.message || 'failed';
      setOnline(false);
    } finally {
      syncing = false;
      notify('sync');
      /* only rebuild the page when the cloud actually brought something new */
      if (changed) notify();
    }
  }

  function setOnline(v){ online = v; }
  function onChange(fn){ listeners.add(fn); return () => listeners.delete(fn); }
  function notify(what){ listeners.forEach(fn => { try { fn(what); } catch(e){} }); }

  function exportAll(){
    return JSON.stringify({ app:'j3prep-gym', exportedAt:new Date().toISOString(), data:state.data }, null, 2);
  }
  function importAll(json){
    const parsed = JSON.parse(json);
    const src = parsed.data || parsed.tables;
    if (!src) throw new Error('Not a J3 Gym backup file');
    let n = 0;
    for (const t of TABLES) for (const row of src[t] || []){
      if (!row.id) continue;
      const local = state.data[t].find(r => r.id === row.id);
      if (local && Number(local.updated_at||0) >= Number(row.updated_at||0)) continue;
      upsert(t, row, true); n++;
    }
    save(); notify(); scheduleSync();
    return n;
  }

  load(); seed();
  setInterval(sync, 15000);
  window.addEventListener('online', sync);
  window.addEventListener('focus', sync);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) sync(); });

  return {
    rows, get, upsert, remove, sync, onChange, uid, deviceId, setToken, exportAll, importAll,
    get isOnline(){ return online; },
    get isSyncing(){ return syncing; },
    get hasToken(){ return !!token(); },
    get lastError(){ return lastError; },
    get lastSync(){ return state.lastSync; }
  };
})();

/* ---------- helpers ---------- */

const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const iso = d => d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
const todayISO = () => iso(new Date());
function tsOf(s){ const p = String(s).split('-').map(Number); return new Date(p[0], p[1]-1, p[2]).getTime(); }
function shiftDate(s, days){ const d = new Date(tsOf(s)); d.setDate(d.getDate()+days); return iso(d); }
function fmtLong(s){ return new Date(tsOf(s)).toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric'}); }
function fmtShort(s){ return new Date(tsOf(s)).toLocaleDateString(undefined,{month:'short',day:'numeric'}); }
function fmtNum(v){ const n = Number(v); return Number.isFinite(n) ? n.toLocaleString(undefined,{maximumFractionDigits:2}) : ''; }

const athletes = () => Store.rows('athletes').sort((a,b) => (a.pos||0)-(b.pos||0) || String(a.name).localeCompare(b.name));
const exercises = () => Store.rows('exercises').sort((a,b) => (a.pos||0)-(b.pos||0) || String(a.name).localeCompare(b.name));
const entryId = (date, exId, athId) => 'e|' + date + '|' + exId + '|' + athId;
function entryValue(date, exId, athId){
  const r = Store.get('entries', entryId(date, exId, athId));
  return r && !r.deleted && r.value !== '' && r.value != null ? r.value : '';
}

let toastTimer = null;
function toast(msg){
  const el = $('#toast');
  el.textContent = msg; el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2400);
}

function bindLog(){
  const rerender = () => render();
  const p = $('#prevday'), n = $('#nextday'), j = $('#jumptoday'), dp = $('#datepick');
  if (p) p.onclick = () => { App.date = shiftDate(App.date, -1); rerender(); };
  if (n) n.onclick = () => { App.date = shiftDate(App.date, 1); rerender(); };
  if (j) j.onclick = () => { App.date = todayISO(); rerender(); };
  if (dp) dp.onchange = ev => { if (ev.target.value) { App.date = ev.target.value; rerender(); } };

  document.querySelectorAll('.cellin').forEach(inp => {
    inp.addEventListener('change', () => {
      const raw = inp.value.trim();
      const id = entryId(App.date, inp.dataset.ex, inp.dataset.ath);
      if (raw === ''){
        if (Store.get('entries', id)) Store.remove('entries', id);
        inp.classList.remove('filled');
      } else {
        const num = Number(raw);
        if (!Number.isFinite(num) || num < 0){ inp.value = ''; inp.classList.remove('filled'); return; }
        Store.upsert('entries', { id, date:App.date, exercise_id:inp.dataset.ex, athlete_id:inp.dataset.ath, value:num, deleted:0 });
        inp.value = num;
        inp.classList.add('filled');
      }
      updateColumnCounts();
    });
    inp.addEventListener('keydown', ev => {
      if (ev.key === 'Enter'){ ev.preventDefault(); inp.blur(); }
    });
  });

  document.querySelectorAll('[data-delex]').forEach(b => {
    b.onclick = () => {
      const ex = Store.get('exercises', b.dataset.delex);
      if (!ex) return;
      if (!confirm('Remove "' + ex.name + '"?\n\nIts past numbers stay in the history and come back if you add it again.')) return;
      Store.remove('exercises', ex.id);
      toast('Removed ' + ex.name);
      render();
    };
  });

  const form = $('#addex');
  if (form) form.onsubmit = ev => {
    ev.preventDefault();
    const name = $('#exname').value.trim();
    if (!name) return;
    Store.upsert('exercises', { id:Store.uid(), name, unit:$('#exunit').value, dir:$('#exdir').value, pos:Date.now(), deleted:0 });
    $('#exname').value = '';
    toast('Added ' + name);
    render();
    const first = document.querySelector('tr:last-child .cellin');
    if (first) first.focus();
  };
}

/* refresh the "n of m" column counters without a full re-render */
function updateColumnCounts(){
  const exs = exercises(), aths = athletes();
  document.querySelectorAll('table.log thead th').forEach((th, i) => {
    if (i === 0) return;
    const a = aths[i-1]; if (!a) return;

/* ---------- view: progress ---------- */

function rangeStart(){
  const now = new Date();
  if (App.range === 'year') return new Date(now.getFullYear(), 0, 1).getTime();
  if (App.range === '90')  { const d = new Date(); d.setDate(d.getDate()-90); return d.getTime(); }
  return 0;
}

function buildChart(dates, series){
  const W = 720, H = 220, ml = 46, mr = 16, mt = 14, mb = 30;
  const iw = W-ml-mr, ih = H-mt-mb;
  const all = series.flatMap(s => s.points.map(p => p.v));
  let min = Math.min.apply(null, all), max = Math.max.apply(null, all);
  if (min === max){ min = min - 1; max = max + 1; }
  const pad = (max-min)*0.14; min -= pad; max += pad;
  if (min < 0 && Math.min.apply(null, all) >= 0) min = 0;

  const t0 = tsOf(dates[0]), t1 = tsOf(dates[dates.length-1]);
  const span = Math.max(1, t1-t0);
  const single = dates.length === 1;
  const X = d => single ? ml + iw/2 : ml + (tsOf(d)-t0)/span*iw;
  const Y = v => mt + (1 - (v-min)/(max-min))*ih;

  let g = '';
  for (let i = 0; i <= 4; i++){
    const v = min + (max-min)*(i/4), y = Y(v);
    g += '<line x1="' + ml + '" y1="' + y.toFixed(1) + '" x2="' + (ml+iw) + '" y2="' + y.toFixed(1) + '" stroke="rgba(247,242,230,.08)" stroke-width="1"/>';
    g += '<text x="' + (ml-9) + '" y="' + (y+4).toFixed(1) + '" text-anchor="end" font-size="11" fill="rgba(247,242,230,.42)" font-family="Inter,sans-serif">' + esc(fmtNum(Math.round(v*10)/10)) + '</text>';
  }

  const xs = single ? [dates[0]] : (dates.length > 2 ? [dates[0], dates[Math.floor(dates.length/2)], dates[dates.length-1]] : [dates[0], dates[dates.length-1]]);
  xs.forEach((d, i) => {
    const anchor = single ? 'middle' : (i === 0 ? 'start' : i === xs.length-1 ? 'end' : 'middle');
    g += '<text x="' + X(d).toFixed(1) + '" y="' + (H-8) + '" text-anchor="' + anchor + '" font-size="11" fill="rgba(247,242,230,.42)" font-family="Inter,sans-serif">' + esc(fmtShort(d)) + '</text>';
  });

  let lines = '';
  for (const s of series){
    const pts = s.points.map(p => X(p.d).toFixed(1) + ',' + Y(p.v).toFixed(1));
    if (pts.length > 1)
      lines += '<polyline points="' + pts.join(' ') + '" fill="none" stroke="' + esc(s.color) + '" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" opacity=".95"/>';
    s.points.forEach((p, i) => {
      const last = i === s.points.length-1;
      if (last) lines += '<circle cx="' + X(p.d).toFixed(1) + '" cy="' + Y(p.v).toFixed(1) + '" r="8" fill="' + esc(s.color) + '" opacity=".2"/>';
      lines += '<circle cx="' + X(p.d).toFixed(1) + '" cy="' + Y(p.v).toFixed(1) + '" r="' + (last ? 4.5 : 3) + '" fill="' + esc(s.color) + '"><title>' + esc(s.name + ' — ' + fmtShort(p.d) + ': ' + fmtNum(p.v)) + '</title></circle>';
    });
  }

  return '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" preserveAspectRatio="xMidYMid meet">' + g + lines + '</svg>';
}

function viewProgress(){
  const aths = athletes(), exs = exercises(), from = rangeStart();
  const all = Store.rows('entries').filter(r => r.value != null && r.value !== '' && tsOf(r.date) >= from);

  const pills = [['year','This year'],['90','Last 90 days'],['all','All time']]
    .map(([k,label]) => '<button class="btn' + (App.range === k ? ' gold' : '') + '" data-range="' + k + '">' + label + '</button>').join('');
  const bar = '<div class="datebar">' + pills + '</div>';

  const cards = [];
  for (const ex of exs){
    const mine = all.filter(r => r.exercise_id === ex.id);
    if (!mine.length) continue;

    const dates = [...new Set(mine.map(r => r.date))].sort((a,b) => tsOf(a)-tsOf(b));
    const series = [];
    for (const a of aths){
      const pts = mine.filter(r => r.athlete_id === a.id)
        .sort((x,y) => tsOf(x.date)-tsOf(y.date))
        .map(r => ({ d:r.date, v:Number(r.value) }));
      if (pts.length) series.push({ id:a.id, name:a.name, color:a.color, points:pts });
    }
    if (!series.length) continue;

    const stats = series.map(s => {
      const first = s.points[0].v, latest = s.points[s.points.length-1].v;
      const vals = s.points.map(p => p.v);
      const best = ex.dir === 'down' ? Math.min.apply(null, vals) : Math.max.apply(null, vals);
      const delta = latest - first;
      const better = ex.dir === 'down' ? delta < 0 : delta > 0;
      const cls = delta === 0 ? 'flat' : better ? 'up' : 'down';
      const sign = delta > 0 ? '+' : '';
      const change = s.points.length < 2
        ? '<span class="chg flat">first entry</span>'
        : '<span class="chg ' + cls + '">' + sign + fmtNum(Math.round(delta*100)/100) + '</span> since ' + esc(fmtShort(s.points[0].d));
      return '<div class="stat" style="--ath:' + esc(s.color) + '">' +
               '<div class="who">' + esc(s.name) + '</div>' +
               '<div class="now">' + esc(fmtNum(latest)) + '</div>' +
               '<div class="sub">' + change + '</div>' +
               '<div class="sub">best ' + esc(fmtNum(best)) + ' · ' + s.points.length + ' session' + (s.points.length === 1 ? '' : 's') + '</div>' +
             '</div>';
    }).join('');

    const legend = series.map(s => '<span style="--ath:' + esc(s.color) + '"><i></i>' + esc(s.name) + '</span>').join('');

    cards.push('<section class="card exercisecard">' +
      '<div class="cardhead"><div><h3>' + esc(ex.name) + '</h3><div class="unit">' + esc(ex.unit || '') +
        (ex.dir === 'down' ? ' · lower is better' : '') + '</div></div>' +
        '<div class="legend">' + legend + '</div></div>' +
      '<div class="chartbox">' + buildChart(dates, series) + '</div>' +
      '<div class="statgrid">' + stats + '</div>' +
    '</section>');
  }

  if (!cards.length)
    return bar + '<div class="card"><div class="empty"><h3>Nothing logged in this range yet</h3>' +
           '<p>Fill in a few numbers on the Today\'s Workout tab and the growth charts build themselves — one line per person, per exercise.</p></div></div>';

  return bar + cards.join('');
}

    Store.upsert('athletes', { ...a, name }); toast('Saved'); render();
  });
  document.querySelectorAll('[data-athcolor]').forEach(i => i.onchange = () => {
    const a = Store.get('athletes', i.dataset.athcolor); if (!a) return;
    Store.upsert('athletes', { ...a, color:i.value }); render();
  });
  document.querySelectorAll('[data-delath]').forEach(b => b.onclick = () => {
    const a = Store.get('athletes', b.dataset.delath); if (!a) return;
    if (!confirm('Remove ' + a.name + ' from the chart?\n\nTheir past numbers are kept and come back if you add them again.')) return;
    Store.remove('athletes', a.id); toast('Removed ' + a.name); render();
  });
  const addA = $('#addath');
  if (addA) addA.onclick = () => {
    const name = $('#newath').value.trim(); if (!name) return;
    const used = athletes().length;
    Store.upsert('athletes', { id:Store.uid(), name, color:PALETTE[used % PALETTE.length], pos:Date.now(), deleted:0 });
    toast('Added ' + name); render();
  };

  document.querySelectorAll('[data-exname]').forEach(i => i.onchange = () => {
    const e = Store.get('exercises', i.dataset.exname); if (!e) return;
    const name = i.value.trim(); if (!name){ i.value = e.name; return; }
    Store.upsert('exercises', { ...e, name }); toast('Saved');
  });
  document.querySelectorAll('[data-exunit]').forEach(s => s.onchange = () => {
    const e = Store.get('exercises', s.dataset.exunit); if (!e) return;
    Store.upsert('exercises', { ...e, unit:s.value });
  });
  document.querySelectorAll('[data-exdir]').forEach(s => s.onchange = () => {
    const e = Store.get('exercises', s.dataset.exdir); if (!e) return;
    Store.upsert('exercises', { ...e, dir:s.value });
  });
  document.querySelectorAll('[data-delex2]').forEach(b => b.onclick = () => {
    const e = Store.get('exercises', b.dataset.delex2); if (!e) return;
    if (!confirm('Remove "' + e.name + '"?')) return;
    Store.remove('exercises', e.id); toast('Removed ' + e.name); render();
  });

  const exp = $('#expbtn');
  if (exp) exp.onclick = () => {
    const blob = new Blob([Store.exportAll()], { type:'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'j3-gym-backup-' + todayISO() + '.json';
    a.click(); URL.revokeObjectURL(a.href);
    toast('Backup downloaded');
  };
  const imp = $('#impbtn'), impf = $('#impfile');
  if (imp) imp.onclick = () => impf.click();
  if (impf) impf.onchange = () => {
    const f = impf.files[0]; if (!f) return;
    const r = new FileReader();
    r.onload = () => {
      try { const n = Store.importAll(r.result); toast('Restored ' + n + ' record' + (n === 1 ? '' : 's')); render(); }
      catch(err){ toast('That file could not be read'); }
    };
    r.readAsText(f);
  };
}

/* ---------- render ---------- */

function render(){
  const host = $('#view');
  if (App.view === 'log'){ host.innerHTML = viewLog(); bindLog(); }
  else if (App.view === 'progress'){ host.innerHTML = viewProgress(); bindProgress(); }
  else { host.innerHTML = viewSetup(); bindSetup(); }
  document.querySelectorAll('nav.tabs button').forEach(b =>
    b.setAttribute('aria-selected', String(b.dataset.view === App.view)));
  renderSync();
}

document.querySelectorAll('nav.tabs button').forEach(b => {
  b.onclick = () => { App.view = b.dataset.view; render(); };
});
$('#syncpill').onclick = async () => {
  if (!Store.hasToken){ App.view = 'setup'; render(); return; }
  toast('Syncing…'); await Store.sync(); render();
};

/* only repaint on remote changes when the user is not mid-edit */
Store.onChange(what => {
  if (what === 'sync'){ renderSync(); return; }
  const a = document.activeElement;
  if (a && (a.tagName === 'INPUT' || a.tagName === 'SELECT')) { renderSync(); return; }
  render();
});

render();
Store.sync();
</script>
</body>
</html>
